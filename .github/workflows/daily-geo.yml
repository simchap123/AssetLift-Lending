name: Daily GEO Content

on:
  schedule:
    - cron: '0 14 * * *'   # 2 PM UTC = 10 AM ET daily (offset from SEO bot at 10 AM UTC)
  workflow_dispatch:

# Serialize with the SEO bot and SEO Pipeline so concurrent pushes to main
# don't collide (the cause of the "failed to push some refs" failures).
concurrency:
  group: content-push
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Generate GEO content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEO_GEMINI_API_KEY: ${{ secrets.GEO_GEMINI_API_KEY }}
        run: node scripts/generate-geo.mjs

      - name: Commit and push if content was added
        run: |
          git config user.name "AssetLift GEO Bot"
          git config user.email "geo-bot@assetliftlending.com"
          git add lib/data/geo-answers.json
          if git diff --staged --quiet; then
            echo "No new GEO content today"
          else
            git commit -m "Daily GEO: add AI answer page [$(date +'%Y-%m-%d')]"
            for i in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                echo "pushed on attempt $i"; break
              fi
              echo "push attempt $i failed; retrying after backoff..."; sleep $((RANDOM % 8 + 3))
            done
          fi
