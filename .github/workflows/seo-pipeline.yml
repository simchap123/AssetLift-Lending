name: SEO Pipeline

# Runs the SEO automation jobs on the cadence documented in SEO-AUTOMATION.md.
# Publishing uses the built-in GITHUB_TOKEN (contents: write) — no PAT needed.

on:
  schedule:
    - cron: '5 4 * * *'    # audit
    - cron: '5 8 * * *'    # authority
    - cron: '5 10 * * *'   # programmatic
    - cron: '5 13 * * *'   # audit refresh
    - cron: '5 16 * * *'   # strategy
    - cron: '5 18 * * *'   # ideas
    - cron: '5 22 * * *'   # programmatic refresh
  workflow_dispatch:
    inputs:
      job:
        description: 'SEO job to run'
        required: true
        default: 'audit'
        type: choice
        options:
          - audit
          - programmatic
          - strategy
          - ideas
          - authority

permissions:
  contents: write

concurrency:
  group: seo-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Pick job for this schedule slot
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.job }}" ]; then
            JOB="${{ github.event.inputs.job }}"
          else
            # Select by the cron expression that triggered this run, NOT the
            # wall-clock hour. GitHub Actions delays scheduled runs (often by
            # 20-60 min), so an hour-based picker missed the authority/strategy/
            # ideas slots and fell through to audit every day.
            case "${{ github.event.schedule }}" in
              "5 4 * * *")  JOB=audit ;;
              "5 8 * * *")  JOB=authority ;;
              "5 10 * * *") JOB=programmatic ;;
              "5 13 * * *") JOB=audit ;;
              "5 16 * * *") JOB=strategy ;;
              "5 18 * * *") JOB=ideas ;;
              "5 22 * * *") JOB=programmatic ;;
              *)            JOB=audit ;;
            esac
          fi
          echo "job=$JOB" >> "$GITHUB_OUTPUT"
          echo "Running SEO job: $JOB (schedule: ${{ github.event.schedule }})"

      - name: Install dependencies
        run: npm ci

      - name: Run SEO job
        env:
          SEO_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEO_GITHUB_REPO: ${{ github.repository }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
          GOOGLE_SEARCH_CONSOLE_SITE_URL: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SITE_URL }}
        run: npx tsx scripts/run-seo-job.ts "${{ steps.pick.outputs.job }}"
